name: Backend - Main - Release on push

on:
  push:
    branches:
      - main
      - master
      - next
      - next-major
      - beta
      - alpha
      - '[0-9]+.[0-9]+.x'
      - '[0-9]+.x'

env:
  java-version: 21
  distribution: graalvm
  node-js-version: 22.x
  author-name: Marc Scheib
  author-email: marc.scheib@cycrilabs.com
  publish-artifacts: false
  build-native-image: false
  IMAGE_NAME: ghcr.io/cycrilabs/keycloak-configurator
  image-tag-short: latest

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout [${{ github.head_ref || github.ref_name }}]
        uses: actions/checkout@v4

      - name: Setup GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          distribution: ${{ env.distribution }}
          java-version: ${{ env.java-version }}
          cache: 'maven'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Adapt maven settings
        uses: s4u/maven-settings-action@v3.1.0
        with:
          servers: '[{"id": "github", "username": "dummy", "password": "${{ secrets.GITHUB_TOKEN }}"}]'
          githubServer: false

      - name: Start containers
        run: chmod +x ./cli.sh && ./cli.sh --start

      - name: Test
        run: mvn -B verify -Pgithub

      - name: Stop containers
        if: always()
        run: chmod +x ./cli.sh && ./cli.sh --stop

  release:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      IMAGE_TAGS: ${{ steps.version.outputs.IMAGE_TAGS }}
    steps:
      - name: Checkout [${{ github.head_ref || github.ref_name }}]
        uses: actions/checkout@v4

      - name: Setup GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          distribution: ${{ env.distribution }}
          java-version: ${{ env.java-version }}
          cache: 'maven'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Adapt maven settings
        uses: s4u/maven-settings-action@v3.1.0
        with:
          servers: '[{"id": "github", "username": "dummy", "password": "${{ secrets.GITHUB_TOKEN }}"}]'
          githubServer: false

      - name: Setup Node.js [${{ env.node-js-version }}]
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.node-js-version }}

      - name: Release
        run: npm exec --package=@semantic-release/changelog --package=@semantic-release/git --package=@semantic-release/exec --yes -- semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: ${{ env.author-name }}
          GIT_AUTHOR_EMAIL: ${{ env.author-email }}

      # Only the release line a branch owns gets its floating tags moved:
      # - main/master: 1.5.0, 1.5, 1, latest
      # - major maintenance branch (1.x): 1.4.0, 1.4, 1
      # - minor maintenance branch (1.4.x): 1.4.1, 1.4
      # - any other branch (next, next-major, beta, alpha): 1.6.0-beta.1 only
      - name: Store image tags
        id: version
        run: |
          TAG_MAJOR_MINOR_PATCH=$(git describe --abbrev=0 --tags)
          TAG_MAJOR_MINOR=$(echo "${TAG_MAJOR_MINOR_PATCH}" | cut -d. -f1,2)
          TAG_MAJOR=$(echo "${TAG_MAJOR_MINOR_PATCH}" | cut -d. -f1)

          if [[ "${GITHUB_REF_NAME}" == "main" || "${GITHUB_REF_NAME}" == "master" ]]; then
            IMAGE_TAGS="${TAG_MAJOR_MINOR_PATCH} ${TAG_MAJOR_MINOR} ${TAG_MAJOR} ${{ env.image-tag-short }}"
          elif [[ "${GITHUB_REF_NAME}" =~ ^[0-9]+\.x$ ]]; then
            IMAGE_TAGS="${TAG_MAJOR_MINOR_PATCH} ${TAG_MAJOR_MINOR} ${TAG_MAJOR}"
          elif [[ "${GITHUB_REF_NAME}" =~ ^[0-9]+\.[0-9]+\.x$ ]]; then
            IMAGE_TAGS="${TAG_MAJOR_MINOR_PATCH} ${TAG_MAJOR_MINOR}"
          else
            IMAGE_TAGS="${TAG_MAJOR_MINOR_PATCH}"
          fi

          echo "Image tags for branch ${GITHUB_REF_NAME}: ${IMAGE_TAGS}"
          echo "IMAGE_TAGS=${IMAGE_TAGS}" >> $GITHUB_OUTPUT

  build-container-image:
    needs: release
    strategy:
      matrix:
        architecture: [amd64, arm64]
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout [${{ github.head_ref || github.ref_name }}]
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Setup GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          distribution: ${{ env.distribution }}
          java-version: ${{ env.java-version }}
          cache: 'maven'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Adapt maven settings
        uses: s4u/maven-settings-action@v2
        with:
          servers: '[{"id": "github", "username": "dummy", "password": "${{ secrets.GITHUB_TOKEN }}"}]'
          githubServer: false

      - name: Deploy project & image
        run: |
          read -r -a IMAGE_TAGS <<< "${{ needs.release.outputs.IMAGE_TAGS }}"
          ARCH_TAGS=("${IMAGE_TAGS[@]/%/-${{ matrix.architecture }}}")
          ADDITIONAL_TAGS=$(IFS=,; echo "${ARCH_TAGS[*]:1}")

          MVN_ARGS=()
          if [[ "${{ env.build-native-image }}" == "true" ]]; then
            MVN_ARGS+=(-Dquarkus.native.container-build=true -Dnative)
          fi
          if [[ -n "${ADDITIONAL_TAGS}" ]]; then
            MVN_ARGS+=(-Dquarkus.container-image.additional-tags=${ADDITIONAL_TAGS})
          fi

          mvn -B package -Pgithub -DskipTests \
            "${MVN_ARGS[@]}" \
            -Dquarkus.jib.platforms=linux/${{ matrix.architecture }} \
            -Dquarkus.container-image.tag=${ARCH_TAGS[0]} \
            -Dquarkus.container-image.build=true \
            -Dquarkus.container-image.push=true \
            -Dquarkus.container-image.registry=ghcr.io \
            -Dquarkus.container-image.username=${{ github.actor }} \
            -Dquarkus.container-image.password=${{ secrets.GITHUB_TOKEN }}

  create-manifest:
    needs: [ release, build-container-image ]
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and Push Manifest
        run: |
          IMAGE_WITHOUT_TAG=${IMAGE_NAME#*/}

          # Version tags to create manifests for
          read -r -a VERSION_TAGS <<< "${{ needs.release.outputs.IMAGE_TAGS }}"

          for VERSION_TAG in "${VERSION_TAGS[@]}"; do
            echo "Creating and pushing manifest for version: ${VERSION_TAG}"

            # Create the manifest
            docker manifest create ghcr.io/${IMAGE_WITHOUT_TAG}:${VERSION_TAG} \
              ghcr.io/${IMAGE_WITHOUT_TAG}:${VERSION_TAG}-amd64 \
              ghcr.io/${IMAGE_WITHOUT_TAG}:${VERSION_TAG}-arm64

            # Add platform-specific annotations
            docker manifest annotate ghcr.io/${IMAGE_WITHOUT_TAG}:${VERSION_TAG} \
              ghcr.io/${IMAGE_WITHOUT_TAG}:${VERSION_TAG}-amd64 --os linux --arch amd64
            docker manifest annotate ghcr.io/${IMAGE_WITHOUT_TAG}:${VERSION_TAG} \
              ghcr.io/${IMAGE_WITHOUT_TAG}:${VERSION_TAG}-arm64 --os linux --arch arm64

            # Push the manifest
            docker manifest push ghcr.io/${IMAGE_WITHOUT_TAG}:${VERSION_TAG}
          done

  build-artifacts:
    needs: release
    strategy:
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout [${{ github.head_ref || github.ref_name }}]
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Setup GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          distribution: ${{ env.distribution }}
          java-version: ${{ env.java-version }}
          cache: 'maven'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Adapt maven settings
        uses: s4u/maven-settings-action@v3.1.0
        with:
          servers: '[{"id": "github", "username": "dummy", "password": "${{ secrets.GITHUB_TOKEN }}"}]'
          githubServer: false

      - name: Build artifacts
        if: ${{ env.publish-artifacts == 'true' }}
        run: mvn -B package -DskipTests -P github,dist,native # space between -P and dist,native is important for Windows PowerShell build

      - name: Upload artifacts
        uses: CycriLabs/publish-assets@v1
        if: ${{ env.publish-artifacts == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          asset_dir: 'target/distributions'
          release_tag: 'latest'

  next-dev-version:
    needs: [build-container-image, build-artifacts]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout [${{ github.head_ref || github.ref_name }}]
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Setup GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          distribution: ${{ env.distribution }}
          java-version: ${{ env.java-version }}
          cache: 'maven'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Adapt maven settings
        uses: s4u/maven-settings-action@v3.1.0
        with:
          servers: '[{"id": "github", "username": "dummy", "password": "${{ secrets.GITHUB_TOKEN }}"}]'
          githubServer: false

      - name: Set next snapshot
        run: mvn versions:set -Pgithub -DnextSnapshot=true && mvn -Pgithub versions:commit

      - name: Commit changes
        uses: EndBug/add-and-commit@v9
        with:
          author_name: ${{ env.author-name }}
          author_email: ${{ env.author-email }}
          message: 'chore: set next development version [skip ci]'
          add: '.'
